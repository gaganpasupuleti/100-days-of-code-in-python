name: Validate Python sources

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile-sources:
    name: compileall (sources/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validation script
        run: bash scripts/validate.sh
